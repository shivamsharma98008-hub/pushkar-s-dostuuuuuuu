<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Vidhi 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Comic Sans MS',cursive;
overflow-x:hidden;
overflow-y:auto;
text-align:center;

background:linear-gradient(
-45deg,
#ffd1dc,
#ffe6f0,
#fff0f5,
#ffd6eb
);

background-size:400% 400%;
animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

#story{
width:100vw;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
z-index:10;
}

.media{
max-width:90%;
max-height:65vh;
border-radius:25px;
border:8px solid rgba(255,255,255,.7);

box-shadow:
0 20px 50px rgba(0,0,0,.25);

animation:zoomIn .8s ease;
}

@keyframes zoomIn{

from{
opacity:0;
transform:
scale(.75)
rotate(-4deg);
}

to{
opacity:1;
transform:
scale(1)
rotate(0deg);
}

}

video.media{
background:black;
padding:5px;
}

.caption{

margin-top:15px;

max-width:850px;

padding:15px 20px;

background:
rgba(255,255,255,.45);

backdrop-filter:blur(10px);

border-radius:20px;

font-size:20px;

color:#ff2e7e;

animation:pulse 2s infinite;
}

@keyframes pulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.04);
}

}

.slideCard{

max-width:900px;

background:
rgba(255,255,255,.5);

backdrop-filter:blur(12px);

padding:30px;

border-radius:30px;

box-shadow:
0 10px 30px rgba(0,0,0,.15);

color:#ff2e7e;

animation:zoomIn .8s ease;
}

#controls{

position:fixed;
bottom:20px;
width:100%;

display:flex;
justify-content:center;

gap:15px;

z-index:20;
}

button{

padding:12px 22px;

border:none;

border-radius:30px;

background:#ff4d88;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;
}

button:hover{
transform:scale(1.1);
}

.magic{

position:fixed;

bottom:-100px;

pointer-events:none;

animation:floatUp linear forwards;

z-index:1;
}

@keyframes floatUp{

0%{
opacity:0;
}

10%{
opacity:1;
}

100%{

transform:
translateY(-120vh)
rotate(360deg);

opacity:0;
}

}

#overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(255,182,193,.15);

display:flex;

justify-content:center;
align-items:center;

opacity:0;

transition:.5s;

pointer-events:none;

z-index:999;
}

#overlayText{

font-size:40px;

font-weight:bold;

color:#ff2e7e;

text-shadow:
0 0 20px white;
}

#musicBtn{

position:fixed;

top:15px;
right:15px;

z-index:1000;
}

.typewriter{

overflow:hidden;

white-space:nowrap;

border-right:
3px solid #ff2e7e;

animation:
typing 5s steps(60,end),
blink .8s infinite;
}

@keyframes typing{

from{
width:0;
}

to{
width:100%;
}

}

@keyframes blink{

50%{
border-color:transparent;
}

}

.firework{

position:fixed;

pointer-events:none;

font-size:30px;

animation:
fireworkAnim 2s linear forwards;
}

@keyframes fireworkAnim{

0%{
opacity:1;
transform:scale(.5);
}

100%{

opacity:0;

transform:
translateY(-200px)
scale(2);
}

}

/* NEW PHOTO POPUP */

.photoPopup{

position:fixed;

top:50%;
left:50%;

transform:
translate(-50%,-50%) scale(0);

width:300px;
height:300px;

border-radius:25px;

overflow:hidden;

z-index:9999;

box-shadow:
0 0 40px rgba(255,0,128,.5);

animation:
popupShow 3s forwards;
}

@keyframes popupShow{

0%{
opacity:0;
transform:
translate(-50%,-50%) scale(0);
}

20%{
opacity:1;
transform:
translate(-50%,-50%) scale(1);
}

80%{
opacity:1;
transform:
translate(-50%,-50%) scale(1);
}

100%{
opacity:0;
transform:
translate(-50%,-50%) scale(0);
}

}

@media(max-width:768px){

.caption{
font-size:17px;
}

.slideCard{
padding:20px;
}

.slideCard h1{
font-size:35px;
}

#overlayText{
font-size:28px;
}

button{
font-size:14px;
padding:10px 18px;
}

.photoPopup{
width:220px;
height:220px;
}

}

</style>

let current = 0;

const story = document.getElementById("story");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

function renderSlide(){

const slide = slides[current];

story.innerHTML = "";

if(slide.type === "message"){

story.innerHTML = `
<div class="slideCard">

<h1 style="
font-size:55px;
margin-bottom:15px;
">
${slide.title}
</h1>

<p style="
font-size:26px;
line-height:1.8;
">
${slide.text}
</p>

<div style="
font-size:80px;
margin-top:20px;
">
🦄🌈💖✨
</div>

</div>
`;

}
else{

let mediaHTML = "";

if(slide.file.endsWith(".mp4")){

mediaHTML = `
<video
class="media"
controls
controlsList="nodownload"
preload="metadata"
>
<source src="${slide.file}">
</video>
`;

}
else{

mediaHTML = `
<img
class="media"
src="${slide.file}">
`;

}

story.innerHTML =
mediaHTML +
`<div class="caption">
${slide.caption}
</div>`;
}

}

/* OVERLAY */

function showOverlay(text){

overlayText.innerText = text;

overlay.style.opacity = 1;

setTimeout(()=>{

},1200);

"💫 Keep Going..."
];

messages[
Math.floor(
Math.random()*messages.length
)
]

);

setTimeout(()=>{

if(current < slides.length - 1){

current++;

renderSlide();

}
else{

finalScreen();

}

},700);

}

/* PREVIOUS */

function prevSlide(){

if(current > 0){

current--;

renderSlide();

}

}

/* MUSIC */

musicBtn.onclick = () => {

/* FLOATING MAGIC */

const icons = [

"💖",
"💕",
"💗",
"✨",
"⭐",
"🌟",
"🦄",
"🌈",
"🌸",
"🎀"

];

function createMagic(){

let item =
document.createElement("div");

item.className =
"magic";

item.innerHTML =

icons[
Math.floor(
Math.random()*icons.length
)
];

item.style.left =
Math.random()*100 + "vw";

item.style.fontSize =
(20 + Math.random()*45) + "px";

item.style.animationDuration =
(8 + Math.random()*8) + "s";

document.body.appendChild(item);

setTimeout(()=>{

item.remove();

},16000);

}

setInterval(
createMagic,
150
);

/* FIREWORKS */

function fireworks(){

for(let i=0;i<250;i++){

setTimeout(()=>{

let fw =
document.createElement("div");

fw.className =
"firework";

fw.innerHTML =

icons[
Math.floor(
Math.random()*icons.length
)
];

fw.style.left =
Math.random()*100 + "vw";

fw.style.top =
Math.random()*100 + "vh";

document.body.appendChild(fw);

setTimeout(()=>{

fw.remove();

},2000);

},i*20);

}

}

"click",

e.target.tagName==="BUTTON" ||
e.target.tagName==="VIDEO"
) return;

let heart =
document.createElement("div");

heart.className =
"magic";

heart.innerHTML =
"💖";

heart.style.left =
e.clientX + "px";

heart.style.fontSize =
"30px";

heart.style.animationDuration =
"4s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},4000);

}
